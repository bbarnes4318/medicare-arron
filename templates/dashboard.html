<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Proxy Access Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="navbar">
      <h1>Medicare Form Portal</h1>
      <div class="navbar-right">
        <button
          class="logout-btn"
          onclick="window.location.href='{{ url_for('logout') }}';"
        >
          Logout
        </button>
      </div>
    </div>

    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}



      <div class="card">
        <h2>🎯 Quick Actions</h2>
        <div class="quick-actions">
                <a href="{{ url_for('submit_form') }}" class="action-card">
                    <h3>📋</h3>
                    <h3>Submit Form</h3>
                    <p>Submit form through proxy</p>
                </a>
                <a href="{{ url_for('view_leads') }}" class="action-card" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    <h3>👥</h3>
                    <h3>View Leads</h3>
                    <p>See captured data</p>
                </a>
            </div>
        </div>
    </div>

    <script>
        async function launchBrowser() {
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            
            if (btn.classList.contains('loading')) return;
            
            btn.style.opacity = '0.7';
            btn.innerHTML = '<h3>⏳</h3><h3>Launching...</h3><p>Please wait</p>';
            
            try {
                const response = await fetch('/launch-browser', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error launching browser: ' + error.message);
            } finally {
                btn.style.opacity = '1';
                btn.innerHTML = originalContent;
            }
        }

        async function testProxy() {
            const btn = document.getElementById('testBtn');
            const resultBox = document.getElementById('resultBox');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Testing...';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('/api/test-proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: 'https://ipv4.icanhazip.com'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultBox.className = 'result-box success';
                    resultBox.innerHTML = `
                        <strong>✅ Success!</strong>
                        <div class="ip-display">${data.ip_address}</div>
                        <p>${data.message}</p>
                        <small>Status Code: ${data.status_code}</small>
                    `;
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.innerHTML = `
                        <strong>❌ Connection Failed</strong>
                        <p>${data.error}</p>
                        <small>${data.details}</small>
                    `;
                }
            } catch (error) {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `
                    <strong>❌ Error</strong>
                    <p>An unexpected error occurred: ${error.message}</p>
                `;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Test Proxy Now';
                resultBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
